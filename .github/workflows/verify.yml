name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETWORK_ATLAS_HERMES_ROOT: ${{ github.workspace }}/.hermes-runtime-source
      TMPDIR: ${{ runner.temp }}/atlas-test-scratch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Exact native Hermes test source (no live activation)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: f42f579cf8bac4918ac9599bece71618afadd846
          path: .hermes-runtime-source
          persist-credentials: false
      - name: Prepare isolated verifier prerequisites
        run: |
          mkdir -p "$TMPDIR"
          python3 -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Record complete checked-out source identity
        run: git rev-parse HEAD HEAD^{tree}
      - name: Packet-denied admission policy and legacy refusal regressions
        run: |
          python3 -B tests/test_ci_admission.py -v
          python3 -B tests/test_caution_confirmation.py -v
      # Explicit CAUTION-only exception on this fresh hosted Ubuntu VM. Full native
      # scanning, dangerous refusal and dependency admission remain unchanged.
      # No local/runtime force authority is implied by environment diagnostics.
      - name: Online prerequisite setup — isolated supported install and enable
        run: |
          python3 scripts/prepare_acceptance.py --hermes-source "$NETWORK_ATLAS_HERMES_ROOT" --admission-mode hosted-ci-caution | tee "$TMPDIR/native-setup.log"
          python3 -c 'import os,pathlib; lines=pathlib.Path(os.environ["TMPDIR"],"native-setup.log").read_text().splitlines(); value=next(x for x in lines if x.startswith("NETWORK_ATLAS_ACCEPTANCE_FIXTURE=")); pathlib.Path(os.environ["GITHUB_ENV"]).open("a").write(value+"\n")'
      - name: Canonical offline verification — mandatory cumulative host-method and native restart coverage
        run: python3 scripts/verify.py
